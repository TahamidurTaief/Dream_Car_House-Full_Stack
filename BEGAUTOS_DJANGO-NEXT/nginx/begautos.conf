# =============================================================================
# BegAutos Nginx Configuration
#
# Architecture:
#   begautos.com           → Next.js frontend  (port 3000)
#   author.begautos.com    → Django admin panel (port 8000)
#   begautos.com/api/      → Proxied to Django  (port 8000)
#   begautos.com/static/   → Django static files
#   begautos.com/media/    → Django media files
#
# Place this file at:  /etc/nginx/sites-available/begautos.conf
# Enable with:         sudo ln -s /etc/nginx/sites-available/begautos.conf \
#                                 /etc/nginx/sites-enabled/begautos.conf
#
# After changes:       sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ── Upstream backends ────────────────────────────────────────────────────────
upstream nextjs_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream django_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── HTTP redirects ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name begautos.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.begautos.com$request_uri;
    }
}

server {
    listen 80;
    server_name www.begautos.com author.begautos.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS non-www → www redirect ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name begautos.com;

    ssl_certificate     /etc/letsencrypt/live/begautos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/begautos.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.begautos.com$request_uri;
}

# ── Main site: www.begautos.com ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.begautos.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/begautos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/begautos.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # File upload limit (for car images, videos, etc.)
    client_max_body_size 200M;

    # ── Django static files ───────────────────────────────────────────────────
    location /static/ {
        alias /path/to/backend/static_root/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Django media files ────────────────────────────────────────────────────
    location /media/ {
        alias /path/to/backend/media_root/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Backend API — proxy to Django ─────────────────────────────────────────
    # Matches /api/v1/..., /admin/, /swagger/, /redoc/
    location ~ ^/(api|admin|swagger|redoc|tinymce)(/|$) {
        proxy_pass         http://django_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }

    # ── Next.js frontend — all other requests ─────────────────────────────────
    location / {
        proxy_pass         http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket support (Next.js HMR in dev — not needed in prod but harmless)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # ── Next.js static assets — long cache ────────────────────────────────────
    location /_next/static/ {
        proxy_pass       http://nextjs_app;
        proxy_cache_valid 200 365d;
        add_header       Cache-Control "public, max-age=31536000, immutable";
        access_log       off;
    }
}

# ── Django admin subdomain: author.begautos.com ───────────────────────────────
server {
    listen 443 ssl http2;
    server_name author.begautos.com;

    ssl_certificate     /etc/letsencrypt/live/author.begautos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/author.begautos.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 200M;

    location /static/ {
        alias /path/to/backend/static_root/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /path/to/backend/media_root/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass         http://django_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}
