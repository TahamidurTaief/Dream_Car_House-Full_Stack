<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wheel Menu Test</title>
  <style>
    body {
      background: #0b0d11;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    .header-menu-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(18, 23, 33, 0.85) 100%);
      border: 1.5px solid rgba(234, 179, 8, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #ffffff;
      padding: 6px 18px 6px 8px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      user-select: none;
    }

    .header-menu-btn:hover {
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.25) 0%, rgba(26, 32, 44, 0.9) 100%);
      border-color: #facc15;
      transform: translateY(-1px) scale(1.04);
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.4), 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    .wheel-icon-box {
      width: 38px;
      height: 38px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .car-wheel-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
    }

    /* Caliper stays static, spokes spin */
    .wheel-spokes-group {
      transform-origin: 50px 50px;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Idle hover subtle spin */
    .header-menu-btn:hover .wheel-spokes-group {
      animation: wheelIdleDrift 3s linear infinite;
    }

    /* High speed burnout click spin */
    .wheel-spinning .wheel-spokes-group {
      animation: wheelClickLaunch 0.85s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards !important;
    }

    @keyframes wheelIdleDrift {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes wheelClickLaunch {
      0% { transform: rotate(0deg); }
      30% { transform: rotate(270deg); }
      70% { transform: rotate(630deg); }
      100% { transform: rotate(720deg); }
    }

    .menu-btn-label {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ffffff;
      transition: color 0.25s ease;
    }

    .header-menu-btn:hover .menu-btn-label {
      color: #facc15;
    }
  </style>
</head>
<body>
  <button class="header-menu-btn" onclick="testSpin(this)">
    <div class="wheel-icon-box">
      <svg class="car-wheel-svg" viewBox="0 0 100 100">
        <!-- Outer Tire Rubber -->
        <circle cx="50" cy="50" r="48" fill="#11141a" stroke="#232833" stroke-width="3"/>
        <circle cx="50" cy="50" r="45" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="2, 3"/>
        
        <!-- Gold Lip Rim -->
        <circle cx="50" cy="50" r="41" fill="#0d1117" stroke="#eab308" stroke-width="2.5"/>

        <!-- Drilled Brake Rotor Disk (Behind Spokes) -->
        <circle cx="50" cy="50" r="32" fill="#1f242d" stroke="#4b5563" stroke-width="1"/>
        <circle cx="50" cy="50" r="28" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="2, 5"/>
        <circle cx="50" cy="50" r="23" fill="none" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2, 4"/>

        <!-- Gold Performance Brake Caliper (Stationary at top-left) -->
        <path d="M 23,28 A 34 34 0 0 1 42,16 L 39,23 A 26 26 0 0 0 25,32 Z" fill="#eab308" stroke="#facc15" stroke-width="1"/>
        <circle cx="29" cy="24" r="1.5" fill="#000"/>
        <circle cx="36" cy="19" r="1.5" fill="#000"/>

        <!-- Rotating Alloy Spoke Assembly -->
        <g class="wheel-spokes-group">
          <!-- 5-Twin Forged Aerodynamic Spokes -->
          <!-- Spoke 1 (0 deg) -->
          <path d="M 47,50 L 46,14 L 49,12 L 50,50 Z" fill="url(#spokeGrad)"/>
          <path d="M 53,50 L 54,14 L 51,12 L 50,50 Z" fill="url(#spokeGrad2)"/>
          <!-- Spoke 2 (72 deg) -->
          <g transform="rotate(72 50 50)">
            <path d="M 47,50 L 46,14 L 49,12 L 50,50 Z" fill="url(#spokeGrad)"/>
            <path d="M 53,50 L 54,14 L 51,12 L 50,50 Z" fill="url(#spokeGrad2)"/>
          </g>
          <!-- Spoke 3 (144 deg) -->
          <g transform="rotate(144 50 50)">
            <path d="M 47,50 L 46,14 L 49,12 L 50,50 Z" fill="url(#spokeGrad)"/>
            <path d="M 53,50 L 54,14 L 51,12 L 50,50 Z" fill="url(#spokeGrad2)"/>
          </g>
          <!-- Spoke 4 (216 deg) -->
          <g transform="rotate(216 50 50)">
            <path d="M 47,50 L 46,14 L 49,12 L 50,50 Z" fill="url(#spokeGrad)"/>
            <path d="M 53,50 L 54,14 L 51,12 L 50,50 Z" fill="url(#spokeGrad2)"/>
          </g>
          <!-- Spoke 5 (288 deg) -->
          <g transform="rotate(288 50 50)">
            <path d="M 47,50 L 46,14 L 49,12 L 50,50 Z" fill="url(#spokeGrad)"/>
            <path d="M 53,50 L 54,14 L 51,12 L 50,50 Z" fill="url(#spokeGrad2)"/>
          </g>

          <!-- Inner Rim Accent Ring -->
          <circle cx="50" cy="50" r="39" fill="none" stroke="#facc15" stroke-width="1.2" opacity="0.8"/>

          <!-- Center Wheel Hub -->
          <circle cx="50" cy="50" r="13" fill="#0b0d11" stroke="#eab308" stroke-width="2"/>
          <circle cx="50" cy="50" r="8" fill="#1f2937" stroke="#facc15" stroke-width="1.2"/>
          
          <!-- Lug Nuts -->
          <circle cx="50" cy="42" r="1.5" fill="#facc15"/>
          <circle cx="57" cy="47" r="1.5" fill="#facc15"/>
          <circle cx="55" cy="55" r="1.5" fill="#facc15"/>
          <circle cx="45" cy="55" r="1.5" fill="#facc15"/>
          <circle cx="43" cy="47" r="1.5" fill="#facc15"/>

          <!-- Center Cap Emblem -->
          <polygon points="50,47 53,50 50,53 47,50" fill="#eab308"/>
        </g>

        <!-- Gradients -->
        <defs>
          <linearGradient id="spokeGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#9ca3af"/>
          </linearGradient>
          <linearGradient id="spokeGrad2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#9ca3af"/>
            <stop offset="100%" stop-color="#d1d5db"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <span class="menu-btn-label">MENU</span>
  </button>

  <script>
    function testSpin(btn) {
      btn.classList.remove('wheel-spinning');
      void btn.offsetWidth; // trigger reflow
      btn.classList.add('wheel-spinning');
    }
  </script>
</body>
</html>
