services:
  # 1. PostgreSQL Production Database
  postgres:
    image: postgres:16-alpine
    container_name: dch_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dreamcarhouse_db}
      POSTGRES_USER: ${POSTGRES_USER:-dch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dch_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dch_user} -d ${POSTGRES_DB:-dreamcarhouse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dch_network

  # 2. Redis In-Memory Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: dch_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dch_network

  # 3. Django REST API Backend (Gunicorn)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dch_backend
    restart: always
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.production
      - DATABASE_URL=postgres://${POSTGRES_USER:-dch_user}:${POSTGRES_PASSWORD:-dch_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-dreamcarhouse_db}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,dreamcarhouse.com,www.dreamcarhouse.com}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3100,https://dreamcarhouse.com,https://www.dreamcarhouse.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://dreamcarhouse.com,https://www.dreamcarhouse.com}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dch-super-secret-key-prod-2026}
    volumes:
      - static_volume:/app/static_root
      - media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dch_network

  # 4. Celery Asynchronous Background Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dch_celery
    restart: always
    command: celery -A core worker -l info --concurrency=2
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.production
      - DATABASE_URL=postgres://${POSTGRES_USER:-dch_user}:${POSTGRES_PASSWORD:-dch_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-dreamcarhouse_db}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - media_volume:/app/media
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - dch_network

  # 5. Next.js Luxury Frontend (SSR)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dch_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - INTERNAL_BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://dreamcarhouse.com}
      - PORT=3000
    depends_on:
      - backend
    networks:
      - dch_network

  # 6. Node.js Custom Dynamic Workspace Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dch_custom_dashboard
    restart: always
    environment:
      - NODE_ENV=production
      - INTERNAL_BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BASE_URL:-https://dreamcarhouse.com}
      - PORT=3100
    depends_on:
      - backend
    networks:
      - dch_network

  # 7. High-Performance Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: dch_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_challenge:/var/www/certbot
    depends_on:
      - frontend
      - backend
      - dashboard
    networks:
      - dch_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_certs:
  certbot_challenge:

networks:
  dch_network:
    driver: bridge
